<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Task Agent</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Personal Task Agent</h1>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="chat">Chat</button>
        <button class="tab-btn" data-tab="history">Workflow History</button>
        <button class="tab-btn" data-tab="notes">Notes</button>
        <button class="tab-btn" data-tab="logs">Logs</button>
      </nav>
    </header>

    <main class="app-main">
      <section id="tab-chat" class="tab-panel active">
        <p class="placeholder">Chat interface will be implemented in a later milestone.</p>
      </section>

      <section id="tab-history" class="tab-panel">
        <p class="placeholder">Workflow history dashboard will be implemented in a later milestone.</p>
      </section>

      <section id="tab-notes" class="tab-panel">
        <div class="notes-toolbar">
          <input
            type="text"
            id="notes-search-input"
            class="input"
            placeholder="Search notes by title or content..."
          />
          <button id="notes-new-btn" class="btn btn-primary">+ New Note</button>
        </div>

        <div id="notes-state" class="notes-state"></div>
        <div id="notes-grid" class="notes-grid"></div>
        <div id="notes-pagination" class="pagination"></div>
      </section>

      <section id="tab-logs" class="tab-panel">
        <p class="placeholder">Execution logs viewer will be implemented in a later milestone.</p>
      </section>
    </main>
  </div>

  <div id="note-modal" class="modal-overlay hidden">
    <div class="modal card">
      <h3 id="note-modal-title">New Note</h3>
      <label class="field-label" for="note-title-input">Title</label>
      <input type="text" id="note-title-input" class="input" placeholder="Note title" maxlength="255" />
      <label class="field-label" for="note-content-input">Content</label>
      <textarea id="note-content-input" class="input textarea" rows="6" placeholder="Note content"></textarea>
      <div class="modal-actions">
        <button id="note-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="note-save-btn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/history.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/logs.js"></script>
  <script>
    // Minimal tab-switching logic; each panel's real behavior arrives with its milestone.
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      });
    });
  </script>
</body>
</html>
